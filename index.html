<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a24;
            --bg-card: #16161f;
            --text-primary: #f5f5f7;
            --text-secondary: #a0a0b0;
            --text-muted: #6b6b7b;
            --accent-primary: #d4a853;
            --accent-secondary: #e8c068;
            --accent-glow: rgba(212, 168, 83, 0.15);
            --border-subtle: rgba(255, 255, 255, 0.06);
            --border-accent: rgba(212, 168, 83, 0.3);
            --gradient-gold: linear-gradient(135deg, #d4a853 0%, #f0d78c 50%, #d4a853 100%);
            --shadow-lg: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            --shadow-glow: 0 0 40px rgba(212, 168, 83, 0.1);
            --radius-sm: 6px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-bounce: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            --skill-bar-bg: #8B2035;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Source Sans 3', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.7;
            font-weight: 400;
            overflow-x: hidden;
        }

        /* Matrix Canvas Background */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0;
            transition: opacity 0.8s ease;
            pointer-events: none;
        }

        #matrix-canvas.active {
            opacity: 1;
        }

        /* Background texture */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(ellipse at 20% 20%, rgba(212, 168, 83, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(212, 168, 83, 0.02) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
            transition: opacity 0.8s ease;
        }

        body.matrix-mode .bg-overlay {
            opacity: 0;
        }

        /* Noise texture overlay */
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.015;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1;
        }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-subtle);
            transition: var(--transition-smooth);
        }

        .header.scrolled {
            background: rgba(10, 10, 15, 0.95);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 2rem;
        }

        .logo {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            background: var(--gradient-gold);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
        }

        .role-filter-container {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .role-label {
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .role-filters {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .role-btn {
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 0.6rem 1.2rem;
            border: 1px solid var(--border-subtle);
            border-radius: 100px;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition-fast);
            white-space: nowrap;
        }

        .role-btn:hover {
            border-color: var(--border-accent);
            color: var(--text-primary);
            background: var(--accent-glow);
        }

        .role-btn.active {
            background: var(--gradient-gold);
            border-color: transparent;
            color: var(--bg-primary);
            box-shadow: var(--shadow-glow);
        }

        /* Matrix mode styling for Software Engineer */
        body.matrix-mode .role-btn.active {
            background: linear-gradient(135deg, #00ff41 0%, #00cc33 50%, #00ff41 100%);
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.3);
        }

        body.matrix-mode .logo {
            background: linear-gradient(135deg, #00ff41 0%, #88ff88 50%, #00ff41 100%);
            -webkit-background-clip: text;
            background-clip: text;
        }

        /* Main content */
        main {
            position: relative;
            z-index: 2;
            padding-top: 100px;
            padding-bottom: 100px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* Section styling */
        section {
            padding: 5rem 0;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.8s ease forwards;
        }

        section:nth-child(1) { animation-delay: 0.1s; }
        section:nth-child(2) { animation-delay: 0.2s; }
        section:nth-child(3) { animation-delay: 0.3s; }
        section:nth-child(4) { animation-delay: 0.4s; }
        section:nth-child(5) { animation-delay: 0.5s; }
        section:nth-child(6) { animation-delay: 0.6s; }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .section-header {
            margin-bottom: 3rem;
            position: relative;
        }

        .section-label {
            font-family: 'Outfit', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--accent-primary);
            margin-bottom: 0.5rem;
        }

        body.matrix-mode .section-label {
            color: #00ff41;
        }

        .section-title {
            font-family: 'Outfit', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.2;
        }

        /* Hero Section */
        .hero {
            min-height: 80vh;
            display: flex;
            align-items: center;
            padding-top: 3rem;
        }

        .hero-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        .hero-text h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 1.1;
            margin-bottom: 1.5rem;
        }

        .hero-text h1 span {
            background: var(--gradient-gold);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        body.matrix-mode .hero-text h1 span {
            background: linear-gradient(135deg, #00ff41 0%, #88ff88 50%, #00ff41 100%);
            -webkit-background-clip: text;
            background-clip: text;
        }

        .hero-bio {
            font-size: 1.2rem;
            color: var(--text-secondary);
            line-height: 1.8;
            margin-bottom: 2rem;
        }

        .hero-image {
            position: relative;
            display: flex;
            justify-content: center;
        }

        .headshot-container {
            position: relative;
            width: 350px;
            height: 350px;
        }

        .headshot-container::before {
            content: '';
            position: absolute;
            inset: -3px;
            background: var(--gradient-gold);
            border-radius: 50%;
            opacity: 0.6;
            filter: blur(2px);
            transition: var(--transition-smooth);
        }

        body.matrix-mode .headshot-container::before {
            background: linear-gradient(135deg, #00ff41 0%, #00cc33 50%, #00ff41 100%);
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.4);
        }

        .headshot-container::after {
            content: '';
            position: absolute;
            inset: -20px;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            border-radius: 50%;
            z-index: -1;
            transition: var(--transition-smooth);
        }

        body.matrix-mode .headshot-container::after {
            background: radial-gradient(circle, rgba(0, 255, 65, 0.15) 0%, transparent 70%);
        }

        .headshot {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            position: relative;
            z-index: 1;
            background: var(--bg-secondary);
            transition: opacity 0.5s ease;
        }

        .headshot.hidden {
            opacity: 0;
            position: absolute;
        }

        /* Skills Section */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .skill-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            transition: var(--transition-smooth);
            opacity: 1;
            transform: scale(1);
        }

        .skill-card:hover {
            border-color: var(--border-accent);
            transform: translateY(-4px);
            box-shadow: var(--shadow-glow);
        }

        body.matrix-mode .skill-card:hover {
            border-color: rgba(0, 255, 65, 0.3);
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.1);
        }

        .skill-card.hidden {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
            position: absolute;
            visibility: hidden;
        }

        .skill-name {
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .skill-description {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        .skill-bar-container {
            background: var(--skill-bar-bg);
            border-radius: 100px;
            height: 8px;
            overflow: hidden;
        }

        .skill-bar {
            height: 100%;
            background: var(--gradient-gold);
            border-radius: 100px;
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        body.matrix-mode .skill-bar {
            background: linear-gradient(135deg, #00ff41 0%, #00cc33 50%, #00ff41 100%);
        }

        .skill-bar::after {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 20px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3));
            border-radius: 0 100px 100px 0;
        }

        .skill-proficiency {
            font-family: 'Outfit', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--accent-primary);
            margin-top: 0.5rem;
            text-align: right;
        }

        body.matrix-mode .skill-proficiency {
            color: #00ff41;
        }

        .skill-roles {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-top: 1rem;
        }

        .skill-role-tag {
            font-size: 0.7rem;
            font-weight: 500;
            padding: 0.25rem 0.6rem;
            background: var(--bg-tertiary);
            border-radius: 100px;
            color: var(--text-muted);
        }

        /* Experience Section */
        .experience-timeline {
            position: relative;
            padding-left: 2rem;
        }

        .experience-timeline::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(180deg, var(--accent-primary), var(--bg-tertiary));
            transition: var(--transition-smooth);
        }

        body.matrix-mode .experience-timeline::before {
            background: linear-gradient(180deg, #00ff41, var(--bg-tertiary));
        }

        .experience-item {
            position: relative;
            padding: 2rem;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            margin-bottom: 1.5rem;
            margin-left: 1.5rem;
            transition: var(--transition-smooth);
        }

        .experience-item::before {
            content: '';
            position: absolute;
            left: -2.4rem;
            top: 2.5rem;
            width: 14px;
            height: 14px;
            background: var(--accent-primary);
            border-radius: 50%;
            border: 3px solid var(--bg-primary);
            box-shadow: 0 0 0 3px var(--accent-glow);
            transition: var(--transition-smooth);
        }

        body.matrix-mode .experience-item::before {
            background: #00ff41;
            box-shadow: 0 0 0 3px rgba(0, 255, 65, 0.15);
        }

        .experience-item:hover {
            border-color: var(--border-accent);
            transform: translateX(8px);
        }

        body.matrix-mode .experience-item:hover {
            border-color: rgba(0, 255, 65, 0.3);
        }

        .experience-item.hidden {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
            position: absolute;
            visibility: hidden;
        }

        .experience-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .company-logo {
            width: 50px;
            height: 50px;
            object-fit: contain;
            background: var(--bg-tertiary);
            border-radius: var(--radius-sm);
            padding: 0.5rem;
        }

        .experience-meta {
            flex: 1;
        }

        .company-name {
            font-family: 'Outfit', sans-serif;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .experience-title {
            color: var(--accent-primary);
            font-size: 0.95rem;
            font-weight: 500;
        }

        body.matrix-mode .experience-title {
            color: #00ff41;
        }

        .experience-duration {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        .experience-description {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.7;
        }

        .experience-links {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .experience-link {
            font-size: 0.8rem;
            color: var(--accent-primary);
            text-decoration: none;
            padding: 0.4rem 0.8rem;
            border: 1px solid var(--border-accent);
            border-radius: 100px;
            transition: var(--transition-fast);
        }

        body.matrix-mode .experience-link {
            color: #00ff41;
            border-color: rgba(0, 255, 65, 0.3);
        }

        .experience-link:hover {
            background: var(--accent-glow);
        }

        body.matrix-mode .experience-link:hover {
            background: rgba(0, 255, 65, 0.1);
        }

        /* Education Section */
        .education-grid {
            display: grid;
            gap: 2rem;
        }

        .education-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 2.5rem;
            transition: var(--transition-smooth);
        }

        .education-card:hover {
            border-color: var(--border-accent);
            box-shadow: var(--shadow-glow);
        }

        body.matrix-mode .education-card:hover {
            border-color: rgba(0, 255, 65, 0.3);
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.1);
        }

        .education-card.hidden {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
            position: absolute;
            visibility: hidden;
        }

        .education-institution {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .education-course {
            font-size: 1.1rem;
            color: var(--accent-primary);
            margin-bottom: 0.5rem;
        }

        body.matrix-mode .education-course {
            color: #00ff41;
        }

        .education-grade {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            padding: 0.5rem 1rem;
            background: var(--bg-tertiary);
            border-radius: 100px;
            display: inline-block;
        }

        .education-description {
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
        }

        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .module-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            background: var(--bg-tertiary);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
        }

        .module-grade {
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            color: var(--accent-primary);
        }

        body.matrix-mode .module-grade {
            color: #00ff41;
        }

        /* Projects Section */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 2rem;
        }

        .project-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            overflow: hidden;
            transition: var(--transition-smooth);
        }

        .project-card:hover {
            border-color: var(--border-accent);
            transform: translateY(-8px);
            box-shadow: var(--shadow-lg);
        }

        body.matrix-mode .project-card:hover {
            border-color: rgba(0, 255, 65, 0.3);
        }

        .project-card.hidden {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
            position: absolute;
            visibility: hidden;
        }

        .project-images {
            height: 200px;
            background: var(--bg-tertiary);
            position: relative;
            overflow: hidden;
        }

        .project-images.has-images {
            cursor: pointer;
        }

        .project-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition-smooth);
        }

        .project-card:hover .project-image {
            transform: scale(1.05);
        }

        .project-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--bg-tertiary) 0%, var(--bg-secondary) 100%);
        }

        .project-placeholder-icon {
            width: 60px;
            height: 60px;
            opacity: 0.3;
        }

        .project-image-counter {
            position: absolute;
            bottom: 1rem;
            right: 1rem;
            background: rgba(0,0,0,0.7);
            padding: 0.4rem 0.8rem;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .project-content {
            padding: 1.5rem;
        }

        .project-name {
            font-family: 'Outfit', sans-serif;
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }

        .project-description {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            line-height: 1.6;
        }

        .project-date {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .project-technologies {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .tech-tag {
            font-size: 0.75rem;
            font-weight: 500;
            padding: 0.35rem 0.7rem;
            background: var(--accent-glow);
            border: 1px solid var(--border-accent);
            border-radius: 100px;
            color: var(--accent-secondary);
        }

        body.matrix-mode .tech-tag {
            background: rgba(0, 255, 65, 0.1);
            border-color: rgba(0, 255, 65, 0.3);
            color: #00ff41;
        }

        .project-links {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .project-link {
            font-size: 0.8rem;
            color: var(--accent-primary);
            text-decoration: none;
            padding: 0.4rem 0.8rem;
            border: 1px solid var(--border-accent);
            border-radius: 100px;
            transition: var(--transition-fast);
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        body.matrix-mode .project-link {
            color: #00ff41;
            border-color: rgba(0, 255, 65, 0.3);
        }

        .project-link:hover {
            background: var(--accent-glow);
        }

        body.matrix-mode .project-link:hover {
            background: rgba(0, 255, 65, 0.1);
        }

        /* Interests Section */
        .interests-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .interest-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 2rem;
            transition: var(--transition-smooth);
            position: relative;
            overflow: hidden;
        }

        .interest-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--gradient-gold);
            transform: scaleX(0);
            transition: var(--transition-smooth);
        }

        body.matrix-mode .interest-card::before {
            background: linear-gradient(135deg, #00ff41 0%, #00cc33 50%, #00ff41 100%);
        }

        .interest-card:hover {
            border-color: var(--border-accent);
            transform: translateY(-4px);
        }

        body.matrix-mode .interest-card:hover {
            border-color: rgba(0, 255, 65, 0.3);
        }

        .interest-card:hover::before {
            transform: scaleX(1);
        }

        .interest-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }

        .interest-description {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.7;
        }

        /* Floating Footer Navigation */
        .footer-nav {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(22, 22, 31, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-subtle);
            border-radius: 100px;
            padding: 0.75rem 1.5rem;
            display: flex;
            gap: 0.5rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        .nav-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition-fast);
            position: relative;
        }

        .nav-btn::before {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            padding: 0.5rem 0.75rem;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-primary);
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition-fast);
            margin-bottom: 0.5rem;
        }

        .nav-btn:hover::before {
            opacity: 1;
            visibility: visible;
        }

        .nav-btn:hover {
            color: var(--text-primary);
            background: var(--bg-tertiary);
        }

        .nav-btn.active {
            color: var(--accent-primary);
            background: var(--accent-glow);
        }

        body.matrix-mode .nav-btn.active {
            color: #00ff41;
            background: rgba(0, 255, 65, 0.15);
        }

        .nav-btn svg {
            width: 22px;
            height: 22px;
        }

        /* Image Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition-smooth);
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            max-width: 90vw;
            max-height: 90vh;
            position: relative;
        }

        .modal-image {
            max-width: 100%;
            max-height: 85vh;
            object-fit: contain;
            border-radius: var(--radius-md);
        }

        .modal-close {
            position: absolute;
            top: -40px;
            right: 0;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 2rem;
            cursor: pointer;
            opacity: 0.7;
            transition: var(--transition-fast);
        }

        .modal-close:hover {
            opacity: 1;
        }

        .modal-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition-fast);
            font-size: 1.5rem;
        }

        .modal-nav:hover {
            background: var(--accent-glow);
            border-color: var(--border-accent);
        }

        .modal-nav.prev {
            left: -70px;
        }

        .modal-nav.next {
            right: -70px;
        }

        .modal-counter {
            text-align: center;
            margin-top: 1rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Loading state */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 50vh;
            flex-direction: column;
            gap: 1rem;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid var(--border-subtle);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .hero-content {
                grid-template-columns: 1fr;
                text-align: center;
            }

            .hero-text h1 {
                font-size: 3rem;
            }

            .hero-image {
                order: -1;
            }

            .headshot-container {
                width: 280px;
                height: 280px;
            }

            .modal-nav.prev { left: 10px; }
            .modal-nav.next { right: 10px; }
        }

        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 1rem;
                padding: 1rem;
            }

            .role-filter-container {
                flex-direction: column;
                gap: 0.5rem;
            }

            .role-filters {
                justify-content: center;
            }

            .role-btn {
                font-size: 0.75rem;
                padding: 0.5rem 0.9rem;
            }

            main {
                padding-top: 180px;
            }

            section {
                padding: 3rem 0;
            }

            .container {
                padding: 0 1rem;
            }

            .section-title {
                font-size: 2rem;
            }

            .hero-text h1 {
                font-size: 2.5rem;
            }

            .hero-bio {
                font-size: 1rem;
            }

            .skills-grid,
            .projects-grid {
                grid-template-columns: 1fr;
            }

            .experience-timeline {
                padding-left: 1rem;
            }

            .experience-item {
                margin-left: 1rem;
                padding: 1.5rem;
            }

            .experience-item::before {
                left: -1.9rem;
                width: 10px;
                height: 10px;
            }

            .footer-nav {
                padding: 0.5rem 1rem;
                gap: 0.25rem;
            }

            .nav-btn {
                width: 42px;
                height: 42px;
            }

            .nav-btn svg {
                width: 18px;
                height: 18px;
            }
        }

        /* Transition classes for filtering */
        .filterable {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
    </style>
</head>
<body>
    <!-- Matrix Canvas Background -->
    <canvas id="matrix-canvas"></canvas>
    
    <!-- Background overlays -->
    <div class="bg-overlay"></div>
    <div class="noise-overlay"></div>

    <!-- Header -->
    <header class="header" id="header">
        <div class="header-content">
            <div class="logo">Portfolio</div>
            <div class="role-filter-container">
                <span class="role-label">Roles:</span>
                <div class="role-filters" id="roleFilters">
                    <!-- Dynamically populated -->
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main id="mainContent">
        <div class="loading">
            <div class="loading-spinner"></div>
            <p>Loading portfolio data...</p>
        </div>
    </main>

    <!-- Floating Footer Navigation -->
    <nav class="footer-nav" id="footerNav">
        <button class="nav-btn" data-section="hero" data-tooltip="Bio" onclick="scrollToSection('hero')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
        </button>
        <button class="nav-btn" data-section="skills" data-tooltip="Skills" onclick="scrollToSection('skills')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
            </svg>
        </button>
        <button class="nav-btn" data-section="experience" data-tooltip="Experience" onclick="scrollToSection('experience')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
            </svg>
        </button>
        <button class="nav-btn" data-section="education" data-tooltip="Education" onclick="scrollToSection('education')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                <path d="M6 12v5c3 3 9 3 12 0v-5"/>
            </svg>
        </button>
        <button class="nav-btn" data-section="projects" data-tooltip="Projects" onclick="scrollToSection('projects')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
            </svg>
        </button>
        <button class="nav-btn" data-section="interests" data-tooltip="Interests" onclick="scrollToSection('interests')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
        </button>
    </nav>

    <!-- Image Modal -->
    <div class="modal-overlay" id="imageModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <button class="modal-nav prev" onclick="navigateModal(-1)">&#8249;</button>
            <img class="modal-image" id="modalImage" src="" alt="Project image">
            <button class="modal-nav next" onclick="navigateModal(1)">&#8250;</button>
            <div class="modal-counter" id="modalCounter"></div>
        </div>
    </div>

    <script>
        // Global state
        let portfolioData = null;
        let currentRole = 'All';
        let modalImages = [];
        let modalIndex = 0;
        let matrixAnimation = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            setupHeaderScroll();
            setupIntersectionObserver();
            await loadData();
        });

        // Header scroll effect
        function setupHeaderScroll() {
            const header = document.getElementById('header');
            window.addEventListener('scroll', () => {
                header.classList.toggle('scrolled', window.scrollY > 50);
            });
        }

        // Intersection Observer for footer nav highlighting
        function setupIntersectionObserver() {
            const options = {
                root: null,
                rootMargin: '-20% 0px -60% 0px',
                threshold: 0
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const sectionId = entry.target.id;
                        updateActiveNavButton(sectionId);
                    }
                });
            }, options);

            // We'll observe sections after they're rendered
            window.sectionObserver = observer;
        }

        function updateActiveNavButton(sectionId) {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.section === sectionId);
            });
        }

        function scrollToSection(sectionId) {
            const section = document.getElementById(sectionId);
            if (section) {
                const headerHeight = document.getElementById('header').offsetHeight;
                const sectionTop = section.offsetTop - headerHeight - 20;
                window.scrollTo({ top: sectionTop, behavior: 'smooth' });
            }
        }

        // Load JSON data
        async function loadData() {
            try {
                const response = await fetch('./data.json');
                if (!response.ok) throw new Error('Failed to load data');
                portfolioData = await response.json();
                renderFilters();
                renderContent();
                observeSections();
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('mainContent').innerHTML = `
                    <div class="container">
                        <div class="empty-state">
                            <h2>Unable to load portfolio data</h2>
                            <p>Please ensure data.json is in the same directory as this HTML file.</p>
                            <p style="margin-top: 1rem; font-size: 0.8rem; color: var(--text-muted);">Error: ${error.message}</p>
                        </div>
                    </div>
                `;
            }
        }

        function observeSections() {
            setTimeout(() => {
                document.querySelectorAll('section[id]').forEach(section => {
                    window.sectionObserver.observe(section);
                });
            }, 100);
        }

        // Render role filter buttons
        function renderFilters() {
            const container = document.getElementById('roleFilters');
            const roles = portfolioData.roles || ['All'];
            
            container.innerHTML = roles.map(role => `
                <button class="role-btn ${role === 'All' ? 'active' : ''}" 
                        onclick="filterByRole('${role}')"
                        data-role="${role}">
                    ${role}
                </button>
            `).join('');
        }

        // Filter content by role
        function filterByRole(role) {
            currentRole = role;
            
            // Update button states
            document.querySelectorAll('.role-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.role === role);
            });
            
            // Filter all filterable elements
            document.querySelectorAll('.filterable').forEach(el => {
                const roles = JSON.parse(el.dataset.roles || '[]');
                const shouldShow = role === 'All' || roles.includes(role);
                el.classList.toggle('hidden', !shouldShow);
            });

            // Handle Matrix mode for Software Engineer
            const isMatrixMode = role === 'Software Engineer';
            document.body.classList.toggle('matrix-mode', isMatrixMode);
            
            // Toggle Matrix background
            const canvas = document.getElementById('matrix-canvas');
            if (isMatrixMode) {
                canvas.classList.add('active');
                startMatrixAnimation();
            } else {
                canvas.classList.remove('active');
                stopMatrixAnimation();
            }

            // Switch headshots
            updateHeadshot(role);
        }

        // Update headshot based on role
        function updateHeadshot(role) {
            const primaryHeadshot = document.getElementById('primaryHeadshot');
            const altHeadshot = document.getElementById('altHeadshot');
            
            if (!primaryHeadshot || !altHeadshot) return;

            if (role === 'Software Engineer') {
                primaryHeadshot.classList.add('hidden');
                altHeadshot.classList.remove('hidden');
            } else {
                primaryHeadshot.classList.remove('hidden');
                altHeadshot.classList.add('hidden');
            }
        }

        // Matrix Animation
        function startMatrixAnimation() {
            const canvas = document.getElementById('matrix-canvas');
            const ctx = canvas.getContext('2d');

            // Set canvas size
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            // Matrix characters - mix of katakana, numbers, and symbols
            const chars = 'ﾊﾐﾋｰｳｼﾅﾓﾆｻﾜﾂｵﾘｱﾎﾃﾏｹﾒｴｶｷﾑﾕﾗｾﾈｽﾀﾇﾍ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ@#$%^&*(){}[]|;:<>?'.split('');
            
            const fontSize = 16;
            const columns = Math.ceil(canvas.width / fontSize);
            
            // Initialize drops at random positions
            const drops = [];
            const speeds = [];
            const brightness = [];
            
            for (let i = 0; i < columns; i++) {
                drops[i] = Math.random() * -100;
                speeds[i] = 0.5 + Math.random() * 1.5;
                brightness[i] = 0.5 + Math.random() * 0.5;
            }

            function draw() {
                // Semi-transparent black to create trail effect
                ctx.fillStyle = 'rgba(10, 10, 15, 0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                for (let i = 0; i < drops.length; i++) {
                    // Random character
                    const char = chars[Math.floor(Math.random() * chars.length)];
                    
                    const x = i * fontSize;
                    const y = drops[i] * fontSize;

                    // Draw the leading bright character
                    ctx.font = `${fontSize}px monospace`;
                    
                    // Leading character is brightest (white-green)
                    ctx.fillStyle = `rgba(180, 255, 180, ${brightness[i]})`;
                    ctx.fillText(char, x, y);

                    // Draw a trail of fading characters
                    for (let j = 1; j < 20; j++) {
                        const trailY = y - j * fontSize;
                        if (trailY > 0) {
                            const trailChar = chars[Math.floor(Math.random() * chars.length)];
                            const alpha = (1 - j / 20) * brightness[i] * 0.8;
                            
                            // Mix of green shades
                            const green = Math.floor(150 + Math.random() * 105);
                            ctx.fillStyle = `rgba(0, ${green}, 65, ${alpha})`;
                            ctx.fillText(trailChar, x, trailY);
                        }
                    }

                    // Move drop down
                    drops[i] += speeds[i];

                    // Reset drop when it goes off screen
                    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                        drops[i] = Math.random() * -20;
                        speeds[i] = 0.5 + Math.random() * 1.5;
                        brightness[i] = 0.5 + Math.random() * 0.5;
                    }
                }
            }

            // Handle resize
            function handleResize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }

            window.addEventListener('resize', handleResize);

            // Start animation
            matrixAnimation = {
                intervalId: setInterval(draw, 33),
                resizeHandler: handleResize
            };
        }

        function stopMatrixAnimation() {
            if (matrixAnimation) {
                clearInterval(matrixAnimation.intervalId);
                window.removeEventListener('resize', matrixAnimation.resizeHandler);
                matrixAnimation = null;

                // Clear canvas
                const canvas = document.getElementById('matrix-canvas');
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        // Extract domain from URL
        function extractDomain(url) {
            try {
                const hostname = new URL(url).hostname;
                // Remove 'www.' prefix if present
                return hostname.replace(/^www\./, '');
            } catch (e) {
                return 'Link';
            }
        }

        // Check if item matches current role
        function matchesRole(roles) {
            return currentRole === 'All' || (roles && roles.includes(currentRole));
        }

        // Render all content
        function renderContent() {
            const main = document.getElementById('mainContent');
            
            main.innerHTML = `
                ${renderHero()}
                ${renderSkills()}
                ${renderExperience()}
                ${renderEducation()}
                ${renderProjects()}
                ${renderInterests()}
            `;

            // Animate skill bars after render
            setTimeout(animateSkillBars, 500);
        }

        // Render hero section
        function renderHero() {
            const { bio, headshot, headshotalt } = portfolioData;
            return `
                <section class="hero" id="hero">
                    <div class="container">
                        <div class="hero-content">
                            <div class="hero-text">
                                <h1>Building <span>Digital</span> Experiences</h1>
                                <p class="hero-bio">${bio || ''}</p>
                            </div>
                            <div class="hero-image">
                                <div class="headshot-container">
                                    ${headshot ? 
                                        `<img id="primaryHeadshot" src="${headshot}" alt="Profile photo" class="headshot" onerror="this.style.display='none'">` :
                                        `<div id="primaryHeadshot" class="headshot" style="background: var(--bg-secondary);"></div>`
                                    }
                                    ${headshotalt ? 
                                        `<img id="altHeadshot" src="${headshotalt}" alt="Profile photo alternate" class="headshot hidden" onerror="this.style.display='none'">` :
                                        ''
                                    }
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            `;
        }

        // Render skills section
        function renderSkills() {
            const skills = portfolioData.skills || [];
            if (skills.length === 0) return '';

            return `
                <section id="skills">
                    <div class="container">
                        <div class="section-header">
                            <div class="section-label">Expertise</div>
                            <h2 class="section-title">Skills & Technologies</h2>
                        </div>
                        <div class="skills-grid">
                            ${skills.map(skill => `
                                <div class="skill-card filterable" data-roles='${JSON.stringify(skill.roles || [])}'>
                                    <div class="skill-name">${skill.name}</div>
                                    <div class="skill-description">${skill.description || ''}</div>
                                    <div class="skill-bar-container">
                                        <div class="skill-bar" data-proficiency="${skill.proficiency || 0}" style="width: 0%"></div>
                                    </div>
                                    <div class="skill-proficiency">${skill.proficiency || 0}%</div>
                                    ${skill.roles && skill.roles.length ? `
                                        <div class="skill-roles">
                                            ${skill.roles.map(role => `<span class="skill-role-tag">${role}</span>`).join('')}
                                        </div>
                                    ` : ''}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </section>
            `;
        }

        // Animate skill bars
        function animateSkillBars() {
            document.querySelectorAll('.skill-bar').forEach(bar => {
                const proficiency = bar.dataset.proficiency;
                bar.style.width = proficiency + '%';
            });
        }

        // Render experience section
        function renderExperience() {
            const experience = portfolioData.experience || [];
            if (experience.length === 0) return '';

            return `
                <section id="experience">
                    <div class="container">
                        <div class="section-header">
                            <div class="section-label">Career</div>
                            <h2 class="section-title">Work Experience</h2>
                        </div>
                        <div class="experience-timeline">
                            ${experience.map(exp => `
                                <div class="experience-item filterable" data-roles='${JSON.stringify(exp.roles || [])}'>
                                    <div class="experience-header">
                                        ${exp.logo ? `<img src="${exp.logo}" alt="${exp.company} logo" class="company-logo" onerror="this.style.display='none'">` : ''}
                                        <div class="experience-meta">
                                            <div class="company-name">${exp.company}</div>
                                            <div class="experience-title">${exp.title}</div>
                                            <div class="experience-duration">${exp.duration}</div>
                                        </div>
                                    </div>
                                    <p class="experience-description">${exp.description || ''}</p>
                                    ${exp.links && exp.links.length ? `
                                        <div class="experience-links">
                                            ${exp.links.map(link => `<a href="${link}" target="_blank" rel="noopener" class="experience-link">${extractDomain(link)} ↗</a>`).join('')}
                                        </div>
                                    ` : ''}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </section>
            `;
        }

        // Render education section
        function renderEducation() {
            const education = portfolioData.education || [];
            if (education.length === 0) return '';

            return `
                <section id="education">
                    <div class="container">
                        <div class="section-header">
                            <div class="section-label">Background</div>
                            <h2 class="section-title">Education</h2>
                        </div>
                        <div class="education-grid">
                            ${education.map(edu => `
                                <div class="education-card filterable" data-roles='${JSON.stringify(edu.roles || [])}'>
                                    <div class="education-institution">${edu.institution}</div>
                                    <div class="education-course">${edu.course}</div>
                                    ${edu.grade ? `<div class="education-grade">${edu.grade}</div>` : ''}
                                    ${edu.description ? `<p class="education-description">${edu.description}</p>` : ''}
                                    ${edu.modules && edu.modules.length ? `
                                        <div class="section-label" style="margin-top: 1rem;">Key Modules</div>
                                        <div class="modules-grid">
                                            ${edu.modules.map(mod => `
                                                <div class="module-item">
                                                    <span>${mod.name}</span>
                                                    <span class="module-grade">${mod.grade}</span>
                                                </div>
                                            `).join('')}
                                        </div>
                                    ` : ''}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </section>
            `;
        }

        // Render projects section
        function renderProjects() {
            const projects = portfolioData.projects || [];
            if (projects.length === 0) return '';

            return `
                <section id="projects">
                    <div class="container">
                        <div class="section-header">
                            <div class="section-label">Portfolio</div>
                            <h2 class="section-title">Featured Projects</h2>
                        </div>
                        <div class="projects-grid">
                            ${projects.map((project, idx) => `
                                <div class="project-card filterable" data-roles='${JSON.stringify(project.roles || [])}'>
                                    <div class="project-images ${project.images && project.images.length ? 'has-images' : ''}" 
                                         ${project.images && project.images.length ? `onclick="openModal(${idx})"` : ''}>
                                        ${project.images && project.images.length ? `
                                            <img src="${project.images[0]}" alt="${project.name}" class="project-image" 
                                                 onerror="this.parentElement.innerHTML='<div class=\\'project-placeholder\\'><svg class=\\'project-placeholder-icon\\' viewBox=\\'0 0 24 24\\' fill=\\'none\\' stroke=\\'currentColor\\' stroke-width=\\'1.5\\'><rect x=\\'3\\' y=\\'3\\' width=\\'18\\' height=\\'18\\' rx=\\'2\\'/><circle cx=\\'8.5\\' cy=\\'8.5\\' r=\\'1.5\\'/><path d=\\'m21 15-5-5L5 21\\'/></svg></div>'">
                                            ${project.images.length > 1 ? `<div class="project-image-counter">${project.images.length} images</div>` : ''}
                                        ` : `
                                            <div class="project-placeholder">
                                                <svg class="project-placeholder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                                                    <circle cx="8.5" cy="8.5" r="1.5"/>
                                                    <path d="m21 15-5-5L5 21"/>
                                                </svg>
                                            </div>
                                        `}
                                    </div>
                                    <div class="project-content">
                                        <h3 class="project-name">${project.name}</h3>
                                        ${project.startDate || project.endDate ? `
                                            <div class="project-date">${project.startDate}${project.endDate ? ` - ${project.endDate}` : ''}</div>
                                        ` : ''}
                                        ${project.description ? `<p class="project-description">${project.description}</p>` : ''}
                                        ${project.technologies && project.technologies.length ? `
                                            <div class="project-technologies">
                                                ${project.technologies.map(tech => `<span class="tech-tag">${tech}</span>`).join('')}
                                            </div>
                                        ` : ''}
                                        ${project.links && project.links.length ? `
                                            <div class="project-links">
                                                ${project.links.map(link => `<a href="${link}" target="_blank" rel="noopener" class="project-link">${extractDomain(link)} ↗</a>`).join('')}
                                            </div>
                                        ` : ''}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </section>
            `;
        }

        // Render interests section
        function renderInterests() {
            const interests = portfolioData.interests || [];
            if (interests.length === 0) return '';

            return `
                <section id="interests">
                    <div class="container">
                        <div class="section-header">
                            <div class="section-label">Personal</div>
                            <h2 class="section-title">Interests & Hobbies</h2>
                        </div>
                        <div class="interests-grid">
                            ${interests.map(interest => `
                                <div class="interest-card">
                                    <h3 class="interest-title">${interest.title}</h3>
                                    <p class="interest-description">${interest.description || ''}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </section>
            `;
        }

        // Modal functions
        function openModal(projectIndex) {
            const project = portfolioData.projects[projectIndex];
            if (!project || !project.images || !project.images.length) return;
            
            modalImages = project.images;
            modalIndex = 0;
            updateModalImage();
            document.getElementById('imageModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('imageModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        function navigateModal(direction) {
            modalIndex = (modalIndex + direction + modalImages.length) % modalImages.length;
            updateModalImage();
        }

        function updateModalImage() {
            const img = document.getElementById('modalImage');
            const counter = document.getElementById('modalCounter');
            img.src = modalImages[modalIndex];
            counter.textContent = `${modalIndex + 1} / ${modalImages.length}`;
        }

        // Close modal on overlay click
        document.getElementById('imageModal').addEventListener('click', (e) => {
            if (e.target.id === 'imageModal') closeModal();
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('imageModal').classList.contains('active')) return;
            if (e.key === 'Escape') closeModal();
            if (e.key === 'ArrowLeft') navigateModal(-1);
            if (e.key === 'ArrowRight') navigateModal(1);
        });
    </script>
</body>
</html>
