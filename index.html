<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Portfolio</title>
    <meta name="description" content="">
    <meta name="theme-color" content="#0a0a0f">

    <!-- Neutral fallback icon; app.js replaces it with an initials icon built from data.json -->
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">

    <!-- Start the JSON downloads during HTML parse instead of after the deferred script runs -->
    <link rel="preload" href="./data.json" as="fetch" crossorigin="anonymous">
    <link rel="preload" href="./thumbs/manifest.json" as="fetch" crossorigin="anonymous">

    <!--
      No identity is hardcoded here. All SEO/meta — title, description, author, canonical,
      Open Graph, Twitter Card, JSON-LD Person, and the favicon — is generated at runtime by
      app.js from data.json, so this template is fully reusable with anyone's data.
    -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <!-- Matrix Canvas Background -->
    <canvas id="matrix-canvas"></canvas>
    
    <!-- Background overlays -->
    <div class="bg-overlay"></div>
    <div class="noise-overlay"></div>

    <!-- Header -->
    <header class="header" id="header">
        <div class="header-content">
            <div class="logo">Portfolio</div>
            <div class="role-filter-container">
                <span class="role-label">Roles:</span>
                <div class="role-filters" id="roleFilters">
                    <!-- Dynamically populated -->
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main id="mainContent">
        <div class="loading">
            <div class="loading-spinner"></div>
            <p>Loading portfolio data...</p>
        </div>
    </main>

    <!-- Floating Side Navigation (left, vertical, collapsible) -->
    <nav class="footer-nav" id="footerNav" aria-label="Section navigation">
        <button class="nav-toggle" id="navToggle" type="button" aria-label="Collapse navigation" aria-expanded="true" aria-controls="navItems" data-tooltip="Toggle">
            <svg class="nav-toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="15 18 9 12 15 6"/>
            </svg>
        </button>
        <div class="nav-items" id="navItems">
            <button class="nav-btn" data-section="hero" data-tooltip="Bio" onclick="scrollToSection('hero')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
            </button>
            <button class="nav-btn" data-section="skills" data-tooltip="Skills" onclick="scrollToSection('skills')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
                </svg>
            </button>
            <button class="nav-btn" data-section="experience" data-tooltip="Experience" onclick="scrollToSection('experience')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
                    <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
                </svg>
            </button>
            <button class="nav-btn" data-section="education" data-tooltip="Education" onclick="scrollToSection('education')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                    <path d="M6 12v5c3 3 9 3 12 0v-5"/>
                </svg>
            </button>
            <button class="nav-btn" data-section="projects" data-tooltip="Projects" onclick="scrollToSection('projects')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                </svg>
            </button>
            <button class="nav-btn" data-section="software" data-tooltip="Software" onclick="scrollToSection('software')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="16 18 22 12 16 6"/>
                    <polyline points="8 6 2 12 8 18"/>
                </svg>
            </button>
            <button class="nav-btn" data-section="interests" data-tooltip="Interests" onclick="scrollToSection('interests')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                </svg>
            </button>
            <button class="nav-btn" data-section="contact" data-tooltip="Contact" onclick="scrollToSection('contact')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                    <polyline points="22,6 12,13 2,6"/>
                </svg>
            </button>
        </div>
    </nav>

    <!-- Image Gallery Viewer -->
    <div class="modal-overlay" id="imageModal">
        <div class="modal-content" role="dialog" aria-modal="true" aria-label="Project image gallery">
            <!-- Top bar -->
            <div class="modal-topbar">
                <div class="modal-counter" id="modalCounter" aria-live="polite"></div>
                <button class="modal-close" onclick="closeModal()" aria-label="Close gallery">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>

            <!-- Image stage with edge-anchored arrows -->
            <div class="modal-stage" id="modalStage">
                <button class="modal-nav prev" onclick="navigateModal(-1)" aria-label="Previous image">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polyline points="15 18 9 12 15 6"/>
                    </svg>
                </button>
                <div class="modal-spinner" id="modalSpinner" aria-hidden="true"></div>
                <img class="modal-image" id="modalImage" src="" alt="Project image">
                <video class="modal-video" id="modalVideo" controls playsinline preload="metadata" hidden></video>
                <button class="modal-nav next" onclick="navigateModal(1)" aria-label="Next image">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polyline points="9 18 15 12 9 6"/>
                    </svg>
                </button>
            </div>

            <!-- Thumbnail strip -->
            <div class="modal-thumbs" id="modalThumbs" role="tablist" aria-label="Gallery thumbnails"></div>
        </div>
    </div>

    <script src="./app.js" defer></script>
    <script src="./cv.js" defer></script>
</body>
</html>
